backend = "xrender";

# Fade in/out
fading = true;
fade-delta = 5;
fade-in-step = 0.03;
fade-out-step = 0.03;

inactive-opacity = 0.90;
active-opacity = 0.98;

# Fullscreen windows (games, video) stay fully opaque
opacity-rule = [ "100:fullscreen" ];

# Skip compositing for fullscreen windows (lower latency, no tearing/opacity effects)
unredir-if-possible = true;
